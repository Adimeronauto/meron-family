<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הלוח שלי">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1c1e'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%D7%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>הלוח שלי</title>
<style>
  :root{
    --ink:#1c1c1e; --muted:#8e8e93; --faint:#c7c7cc;
    --hair:rgba(0,0,0,.1); --hair2:rgba(0,0,0,.08); --hair3:rgba(0,0,0,.04);
    --bg:#ffffff; --fill:#f7f7f7;
    --font:'Assistant','Segoe UI',system-ui,-apple-system,'SF Hebrew',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#eceae6}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .app{
    position:relative; max-width:460px; margin-inline:auto; min-height:100vh; min-height:100dvh;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
  }
  .time{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

  /* header */
  .hdr{padding:calc(24px + env(safe-area-inset-top)) 24px 18px; flex:none}
  .eyebrow{font-size:22px; font-weight:800; color:var(--ink); letter-spacing:-0.2px; margin-bottom:7px}
  .h1{font-size:40px; font-weight:800; letter-spacing:-0.5px; line-height:1; text-wrap:balance}
  .sub{font-size:15px; font-weight:400; color:var(--muted); margin-top:6px}
  .nav{display:flex; gap:18px; margin-top:22px}
  .nav button{
    appearance:none; background:none; border:0; padding:0 0 6px; cursor:pointer; font-family:inherit;
    font-size:16px; font-weight:400; color:var(--muted); border-bottom:2px solid transparent;
  }
  .nav button[aria-current="true"]{font-weight:700; color:var(--ink); border-bottom-color:var(--ink)}

  /* scroll region */
  .stage{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .pad{padding:8px 24px 24px}

  /* event card */
  .ev{
    border:1px solid var(--hair); border-radius:18px; padding:16px 18px;
    display:flex; align-items:baseline; gap:16px;
  }
  .ev + .ev{margin-top:28px}
  .ev .t{font-size:17px; font-weight:700; width:54px; flex:none}
  .ev .body{flex:1; min-width:0}
  .ev .ttl{font-size:16px; font-weight:400; line-height:1.35}
  .ev .tags{margin-top:5px; display:flex; gap:7px; flex-wrap:wrap}
  .tag{font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--hair); border-radius:999px; padding:2px 9px}
  .tag.test{color:var(--ink); border-color:var(--ink); font-weight:700}
  .allday .t{font-size:13px; font-weight:600; color:var(--muted); width:54px}

  .empty{color:var(--muted); font-size:16px; line-height:1.5; text-align:center; padding:64px 24px}

  /* week strip */
  .strip{display:flex; justify-content:space-between; padding:6px 24px 20px; flex:none}
  .strip .d{display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:none; border:0; font-family:inherit; padding:0}
  .strip .l{font-size:12px; color:var(--muted)}
  .strip .n{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px}
  .strip .d[aria-pressed="true"] .l{font-weight:700; color:var(--ink)}
  .strip .d[aria-pressed="true"] .n{border:2px solid var(--ink); font-weight:700}
  .strip .d .n .dot{position:absolute; margin-top:26px; width:4px; height:4px; border-radius:50%; background:var(--ink)}

  /* month grid */
  .mgrid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:20px; justify-items:center; padding:22px 22px 0}
  .mgrid .wl{font-size:12px; color:var(--muted)}
  .cell{width:34px; height:34px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:15px; position:relative; cursor:pointer; background:none; border:0; font-family:inherit; color:var(--ink)}
  .cell.today{background:var(--ink); color:#fff; font-weight:700}
  .cell.has:not(.today){border:1px solid var(--ink)}
  .cell .mdot{position:absolute; bottom:-9px; width:4px; height:4px; border-radius:50%; background:var(--ink)}
  .cell[aria-pressed="true"]:not(.today){outline:1.5px solid var(--ink); outline-offset:1px}

  /* bottom sheet */
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--bg);
    border-top:1px solid var(--hair); border-radius:24px 24px 0 0;
    box-shadow:0 -4px 16px rgba(0,0,0,.04);
    padding:10px 24px calc(22px + env(safe-area-inset-bottom));
    transition:transform .28s cubic-bezier(.2,.7,.2,1); z-index:5;
    display:flex; flex-direction:column;
  }
  .sheet.expanded{
    top:112px; border-radius:28px 28px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,.08);
    padding:12px 22px calc(28px + env(safe-area-inset-bottom));
  }
  .grip{width:36px; height:4px; background:rgba(0,0,0,.15); border-radius:2px; margin:0 auto 12px; flex:none}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; flex:none}
  .sheet-head .lbl{font-size:16px; font-weight:600}
  .sheet.expanded .sheet-head .lbl{font-size:20px; font-weight:700}
  .sheet-head .cnt{font-size:14px; color:var(--muted)}
  .sheet-body{margin-top:16px; overflow-y:auto; flex:1; display:none}
  .sheet.expanded .sheet-body{display:block}

  /* add row */
  .addrow{display:flex; align-items:center; gap:10px; padding:8px 0 14px; border-bottom:1px solid var(--hair2)}
  .addrow .plus{font-size:22px; color:var(--muted); width:20px; text-align:center; line-height:1}
  .addrow input{flex:1; border:0; outline:0; background:none; font-family:inherit; font-size:16px; color:var(--ink)}
  .addrow input::placeholder{color:var(--faint)}

  /* checklist (Google-Keep style) */
  .krow{display:flex; align-items:center; gap:14px; padding:11px 0}
  .krow-ttl{flex:1; text-align:right; font-size:17px; line-height:1.35}
  .chk{flex:none; width:23px; height:23px; border:2px solid var(--muted); border-radius:6px; background:none; cursor:pointer; padding:0; position:relative; color:#fff; font-size:14px; font-weight:800; line-height:20px; text-align:center}
  .chk::before{content:""; position:absolute; inset:-12px}
  .chk:not(.checked){color:transparent}
  .chk.checked{background:var(--ink); border-color:var(--ink)}
  .krow.done .krow-ttl{text-decoration:line-through; color:var(--faint)}
  .krow.leaving{opacity:0; transform:translateY(-4px); transition:opacity .25s, transform .25s}
  .addrow2{display:flex; align-items:center; gap:14px; padding:12px 0}
  .addrow2 .plus{flex:none; font-size:24px; color:var(--muted); width:23px; text-align:center; line-height:1}
  .addrow2 input{flex:1; border:0; outline:0; background:none; font-family:inherit; font-size:17px; color:var(--ink); text-align:right}
  .addrow2 input::placeholder{color:var(--faint)}
  .donehdr{display:flex; align-items:center; justify-content:space-between; padding:18px 0 6px}
  .donehdr .lft{display:flex; align-items:center; gap:12px; appearance:none; background:none; border:0; cursor:pointer; font-family:inherit; font-size:15px; font-weight:600; color:var(--muted)}
  .donehdr .chev{font-size:11px; width:12px; text-align:center}
  .donehdr .clear{appearance:none; background:none; border:0; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; color:var(--muted)}
  .krow .kdel{flex:none; appearance:none; background:none; border:0; cursor:pointer; font-family:inherit; font-size:17px; color:var(--faint); padding:0 2px; line-height:1}
  .group-h{font-size:13px; font-weight:700; color:var(--muted); padding:14px 0 4px}
  .tasks-empty{text-align:center; color:var(--muted); padding:28px 0; font-size:15px}

  /* tests & homework list */
  .exlist{display:flex; flex-direction:column; gap:14px}
  .exrow{display:flex; align-items:center; gap:16px; border:1px solid var(--hair); border-radius:18px; padding:16px 18px}
  .exrow.today{border:1.5px solid var(--ink); background:#fafafa}
  .exdate{flex:none; width:58px; text-align:center}
  .exdate .d{font-size:17px; font-weight:700}
  .exdate .wd{font-size:12px; color:var(--muted); margin-top:2px}
  .exmid{flex:1; min-width:0}
  .exmid .typ{font-size:12px; color:var(--muted); margin-bottom:3px}
  .exmid .ttl{font-size:16px; font-weight:600; line-height:1.3}
  .excount{flex:none}
  .excount .pill{font-size:13px; font-weight:700; padding:6px 12px; border-radius:14px; white-space:nowrap}
  .excount .pill.p-today{background:var(--ink); color:#fff}
  .excount .pill.p-tom{border:1px solid var(--ink); color:var(--ink)}
  .excount .near{font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap}
  .excount .far{font-size:14px; font-weight:400; color:var(--muted); white-space:nowrap}

  /* month nav + day popup */
  .mnav{display:flex; justify-content:space-between; align-items:center; padding:2px 20px 0}
  .mnav button{appearance:none; background:none; border:0; cursor:pointer; font-family:inherit; font-size:28px; line-height:1; color:var(--ink); padding:4px 14px; border-radius:10px}
  .mnav button:active{background:var(--fill)}
  .backdrop{position:absolute; inset:0; background:rgba(0,0,0,.28); z-index:4; animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet.popup{top:auto; max-height:74%; border-radius:28px 28px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,.12); animation:slideup .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .sheet.popup .sheet-body{display:block; max-height:52vh}
  .sheet-head .back{appearance:none; background:none; border:0; cursor:pointer; font-family:inherit; font-size:15px; font-weight:600; color:var(--muted); padding:2px 2px}

  .center{min-height:100dvh; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:16px; padding:24px}

  @media (prefers-reduced-motion:reduce){.sheet,.task{transition:none}}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"><div class="center" id="boot">טוען…</div></div>

<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var urlTok = qs.get("t");
  if (urlTok) { try { localStorage.setItem("board_token", urlTok); } catch(e){} }
  var TOKEN = urlTok || (function(){ try { return localStorage.getItem("board_token"); } catch(e){ return null; } })();

  var app = document.getElementById("app");
  var S = { view:"day", weekSel:null, monthSheet:null, sheet:"collapsed", monthYM:null, doneOpen:true,
            kid:null, name:"", tz:"Asia/Jerusalem", nowMs:Date.now(), events:[], tasks:{open:[],done:[]} };
  function normTasks(t){ t=t||{}; return { open:t.open||[], done:t.done||[] }; }
  var F = {}; // Intl formatters, built once tz is known

  if (!TOKEN) { boot("אין קישור. פתחו את הקישור האישי שקיבלתם."); return; }

  load();

  function boot(msg){ app.innerHTML = '<div class="center">'+esc(msg)+'</div>'; }

  async function load(){
    try {
      var r = await fetch("/api/board?t=" + encodeURIComponent(TOKEN), { cache:"no-store" });
      if (r.status === 401) return boot("הקישור אינו תקין.");
      if (!r.ok) throw new Error("http "+r.status);
      var d = await r.json();
      if (!d.ok) throw new Error(d.error||"error");
      S.kid=d.kid; S.name=d.name; S.tz=d.tz; S.nowMs=d.nowMs; S.events=d.events||[]; S.tasks=normTasks(d.tasks);
      buildFormatters();
      S.weekSel = todayKey();
      S.monthYM = todayKey().slice(0,7);
      render();
    } catch(e){ boot("לא הצלחתי לטעון. נסו לרענן."); }
  }

  // Re-fetch when the tab is re-opened, so tasks/events stay fresh.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && S.kid) refresh();
  });
  async function refresh(){
    try {
      var r = await fetch("/api/board?t="+encodeURIComponent(TOKEN), {cache:"no-store"});
      var d = await r.json(); if(!d.ok) return;
      S.events=d.events||[]; S.tasks=normTasks(d.tasks); S.nowMs=d.nowMs; render();
    } catch(e){}
  }

  /* ---------- date helpers (timezone-safe) ---------- */
  function buildFormatters(){
    F.day = new Intl.DateTimeFormat("en-CA",{timeZone:S.tz,year:"numeric",month:"2-digit",day:"2-digit"});
    F.time = new Intl.DateTimeFormat("he-IL",{timeZone:S.tz,hour:"2-digit",minute:"2-digit",hour12:false});
    F.wdLong = new Intl.DateTimeFormat("he-IL",{timeZone:S.tz,weekday:"long"});
    F.monthLong = new Intl.DateTimeFormat("he-IL",{timeZone:S.tz,month:"long"});
  }
  function dayKey(ms){ return F.day.format(ms); }             // "YYYY-MM-DD" in tz
  function todayKey(){ return dayKey(S.nowMs); }
  function keyUTC(k){ return new Date(k+"T00:00:00Z"); }
  function addDays(k,n){ return new Date(keyUTC(k).getTime()+n*864e5).toISOString().slice(0,10); }
  function wd(k){ return keyUTC(k).getUTCDay(); }             // 0=Sun..6=Sat
  function weekStart(k){ return addDays(k,-wd(k)); }
  function dayNum(k){ return String(parseInt(k.slice(8),10)); }
  var HE_LETTERS = ["א","ב","ג","ד","ה","ו","ש"];
  function monthFirst(){ return S.monthYM + "-01"; }
  function monthLabel(ym){
    var t=keyUTC(ym+"-01").getTime();
    var name=F.monthLong.format(t), y=ym.slice(0,4), cy=todayKey().slice(0,4);
    return y===cy ? name : name + " " + y;
  }
  function shiftMonth(delta){
    var y=+S.monthYM.slice(0,4), m=+S.monthYM.slice(5,7)+delta;
    while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; }
    S.monthYM = y + "-" + String(m).padStart(2,"0"); S.monthSheet=null; render();
  }
  function daysBetween(aKey,bKey){ return Math.round((keyUTC(bKey).getTime()-keyUTC(aKey).getTime())/864e5); }
  function shortDate(k){ return String(+k.slice(8)) + "." + String(+k.slice(5,7)); } // "5.8"

  function eventsOn(k){
    return S.events.filter(function(e){ return dayKey(e.startMs)===k; })
      .sort(function(a,b){ return a.startMs-b.startMs; });
  }
  function timeStr(e){
    if (e.allDay) return "כל היום";
    var s=F.time.format(e.startMs);
    return s;
  }
  function subtitleFor(k){
    var wl=F.wdLong.format(keyUTC(k).getTime()); // weekday name
    return wl + ", " + dayNum(k) + " ב" + F.monthLong.format(keyUTC(k).getTime());
  }
  function ownerTag(e){
    if (e.isTest) return '<span class="tag test">מבחן</span>';
    if (S.kid==="both" && (e.owner==="amit"||e.owner==="nadav"))
      return '<span class="tag">'+(e.owner==="amit"?"עמית":"נדב")+'</span>';
    return "";
  }

  /* ---------- render ---------- */
  function render(){
    var title, sub;
    if (S.view==="day"){ title="היום"; sub=subtitleFor(todayKey()); }
    else if (S.view==="week"){ title="השבוע"; sub=weekRange(); }
    else if (S.view==="month"){ title=monthLabel(S.monthYM); sub=""; }
    else { title="מבחנים ומטלות"; sub=""; }

    var html = '<div class="hdr">'+
      '<div class="eyebrow">'+esc(S.name)+'</div>'+
      '<div class="h1">'+esc(title)+'</div>'+
      (sub?'<div class="sub">'+esc(sub)+'</div>':'')+
      '<div class="nav">'+
        navBtn("day","יום")+navBtn("week","שבוע")+navBtn("month","חודש")+navBtn("tests","מבחנים")+
      '</div></div>';

    if (S.view==="day") html += dayView();
    else if (S.view==="week") html += weekView();
    else if (S.view==="month") html += monthView();
    else html += testsView();

    app.innerHTML = html;
    wire();
  }
  function navBtn(v,label){
    return '<button data-view="'+v+'" aria-current="'+(S.view===v)+'">'+label+'</button>';
  }

  function evCard(e){
    return '<div class="ev'+(e.allDay?' allday':'')+'">'+
      '<div class="t">'+(e.allDay?'כל היום':'<span class="time">'+esc(timeStr(e))+'</span>')+'</div>'+
      '<div class="body"><div class="ttl">'+esc(e.title)+'</div>'+
        (ownerTag(e)?'<div class="tags">'+ownerTag(e)+'</div>':'')+
      '</div></div>';
  }

  function countdownHTML(k){
    var n=daysBetween(todayKey(), k);
    if (n<=0) return '<span class="pill p-today">היום</span>';
    if (n===1) return '<span class="pill p-tom">מחר</span>';
    var label = n===2 ? "בעוד יומיים" : "בעוד "+n+" ימים";
    return '<span class="'+(n<=6?"near":"far")+'">'+label+'</span>';
  }
  function testsView(){
    var today=todayKey();
    var items = S.events.filter(function(e){ return e.examLabel && dayKey(e.startMs)>=today; })
      .sort(function(a,b){ return a.startMs-b.startMs; });
    if (!items.length)
      return '<div class="stage"><div class="empty">אין מבחנים או מטלות קרובים 🎉</div></div>';
    var rows = items.map(function(e){
      var k=dayKey(e.startMs), n=daysBetween(today,k);
      var who = (S.kid==="both" && (e.owner==="amit"||e.owner==="nadav")) ? ' · '+(e.owner==="amit"?"עמית":"נדב") : '';
      return '<div class="exrow'+(n<=0?" today":"")+'">'+
        '<div class="exdate"><div class="d time">'+shortDate(k)+'</div>'+
          '<div class="wd">'+esc(F.wdLong.format(keyUTC(k).getTime()))+'</div></div>'+
        '<div class="exmid"><div class="typ">'+esc(e.examLabel)+esc(who)+'</div>'+
          '<div class="ttl">'+esc(e.title)+'</div></div>'+
        '<div class="excount">'+countdownHTML(k)+'</div></div>';
    }).join("");
    return '<div class="stage"><div class="pad exlist">'+rows+'</div></div>';
  }

  function dayView(){
    var evs = eventsOn(todayKey());
    var list = evs.length ? '<div class="pad">'+evs.map(evCard).join("")+'</div>'
                          : '<div class="empty">אין אירועים היום</div>';
    return '<div class="stage">'+list+'</div>'+sheet();
  }

  function weekRange(){
    var s=weekStart(S.weekSel), e=addDays(s,6);
    var mS=F.monthLong.format(keyUTC(s).getTime()), mE=F.monthLong.format(keyUTC(e).getTime());
    if (mS===mE) return dayNum(s)+"–"+dayNum(e)+" ב"+mE;
    return dayNum(s)+" ב"+mS+" – "+dayNum(e)+" ב"+mE;
  }
  function weekView(){
    var start=weekStart(S.weekSel);
    var strip='<div class="strip">';
    for (var i=0;i<7;i++){
      var k=addDays(start,i), has=eventsOn(k).length>0;
      strip += '<button class="d" data-day="'+k+'" aria-pressed="'+(k===S.weekSel)+'">'+
        '<span class="l">'+HE_LETTERS[i]+'</span>'+
        '<span class="n">'+dayNum(k)+(has?'<span class="dot"></span>':'')+'</span></button>';
    }
    strip+='</div>';
    var evs=eventsOn(S.weekSel);
    var body = evs.length ? '<div class="pad">'+evs.map(evCard).join("")+'</div>'
                          : '<div class="empty">אין אירועים ביום זה</div>';
    return strip+'<div class="stage">'+body+'</div>';
  }

  function monthView(){
    var first = monthFirst();
    var lead = wd(first);
    var y=+first.slice(0,4), m=+first.slice(5,7);
    var dim = new Date(Date.UTC(y, m, 0)).getUTCDate(); // days in month
    var nav='<div class="mnav"><button data-mprev aria-label="חודש קודם">›</button>'+
            '<button data-mnext aria-label="חודש הבא">‹</button></div>';
    var g='<div class="mgrid">';
    for (var w=0;w<7;w++) g+='<div class="wl">'+HE_LETTERS[w]+'</div>';
    for (var b=0;b<lead;b++) g+='<div></div>';
    for (var day=1; day<=dim; day++){
      var k=first.slice(0,8)+String(day).padStart(2,"0");
      var isToday=k===todayKey(), has=eventsOn(k).length>0;
      var cls="cell"+(isToday?" today":"")+(has&&!isToday?" has":"");
      g+='<button class="'+cls+'" data-mday="'+k+'" aria-pressed="'+(k===S.monthSheet)+'">'+day+
         (has&&!isToday?'<span class="mdot"></span>':'')+'</button>';
    }
    g+='</div>';
    return '<div class="stage">'+nav+g+'</div>'+ (S.monthSheet?monthSheet():"");
  }

  /* ---------- tasks sheet ---------- */
  function openTaskCount(){ return (S.tasks.open||[]).length; }
  function sheet(){
    var expanded=S.sheet==="expanded";
    var head='<div class="grip"></div><div class="sheet-head" data-sheet-toggle>'+
      '<span class="lbl">משימות</span>'+
      (expanded?'<button class="back" data-sheet-collapse>‹ חזרה ללוח</button>':'<span class="cnt">'+openTaskCount()+' היום</span>')+'</div>';
    var body = expanded ? '<div class="sheet-body">'+taskList()+'</div>' : '';
    return '<div class="sheet'+(expanded?' expanded':'')+'">'+head+body+'</div>';
  }
  function taskList(){
    if (S.kid==="both") return bothTaskList();
    var open=S.tasks.open||[], done=S.tasks.done||[];
    var html = open.map(openRow).join("");
    html += '<div class="addrow2"><span class="plus">+</span>'+
      '<input id="newtask" type="text" placeholder="פריט חדש" enterkeyhint="done" maxlength="200"></div>';
    if (!open.length && !done.length) html += '<div class="tasks-empty">אין משימות פתוחות 🎉</div>';
    if (done.length){
      html += '<div class="donehdr"><button class="lft" data-donetoggle>'+
        '<span class="chev">'+(S.doneOpen?"▾":"◂")+'</span>'+done.length+' בוצעו</button>'+
        '<button class="clear" data-doneclear>נקה</button></div>';
      if (S.doneOpen) html += done.map(doneRow).join("");
    }
    return html;
  }
  function openRow(t){
    return '<div class="krow" data-id="'+esc(t.id)+'">'+
      '<span class="krow-ttl">'+esc(t.title)+'</span>'+
      '<button class="chk" data-act="check" aria-label="סימון כבוצע"></button>'+
      '<button class="kdel" data-act="del" aria-label="מחיקה">✕</button></div>';
  }
  function doneRow(t){
    return '<div class="krow done" data-id="'+esc(t.id)+'">'+
      '<span class="krow-ttl">'+esc(t.title)+'</span>'+
      '<button class="chk checked" data-act="uncheck" aria-label="ביטול סימון">✓</button>'+
      '<button class="kdel" data-act="del" aria-label="מחיקה">✕</button></div>';
  }
  function bothTaskList(){
    var open=S.tasks.open||[], html="";
    [["amit","עמית"],["nadav","נדב"]].forEach(function(p){
      var mine=open.filter(function(t){return t.owner===p[0];});
      html+='<div class="group-h">'+p[1]+'</div>';
      html+= mine.length ? mine.map(function(t){
        return '<div class="krow"><span class="krow-ttl">'+esc(t.title)+'</span><span class="chk"></span></div>';
      }).join("") : '<div class="tasks-empty">אין משימות פתוחות</div>';
    });
    return html;
  }
  function monthSheet(){
    var k=S.monthSheet, evs=eventsOn(k);
    var rows = evs.length ? evs.map(evCard).join("") : '<div class="tasks-empty">אין אירועים ביום זה</div>';
    return '<div class="backdrop" data-sheet-close></div>'+
      '<div class="sheet popup"><div class="grip"></div>'+
      '<div class="sheet-head"><span class="lbl">'+dayNum(k)+' ב'+esc(F.monthLong.format(keyUTC(k).getTime()))+'</span>'+
        '<button class="back" data-sheet-close>‹ חזרה ללוח</button></div>'+
      '<div class="sub" style="margin:2px 0 14px">'+esc(F.wdLong.format(keyUTC(k).getTime()))+'</div>'+
      '<div class="sheet-body">'+rows+'</div></div>';
  }

  /* ---------- events ---------- */
  function wire(){
    app.querySelectorAll(".nav button").forEach(function(b){
      b.onclick=function(){ S.view=b.dataset.view; if(S.view!=="day") S.sheet="collapsed"; S.monthSheet=null; if(S.view==="month") S.monthYM=todayKey().slice(0,7); render(); };
    });
    app.querySelectorAll(".strip .d").forEach(function(b){
      b.onclick=function(){ S.weekSel=b.dataset.day; render(); };
    });
    app.querySelectorAll(".cell[data-mday]").forEach(function(b){
      b.onclick=function(){ S.monthSheet = S.monthSheet===b.dataset.mday ? null : b.dataset.mday; render(); };
    });
    var mp=app.querySelector("[data-mprev]"); if(mp) mp.onclick=function(){ shiftMonth(-1); };
    var mn=app.querySelector("[data-mnext]"); if(mn) mn.onclick=function(){ shiftMonth(1); };

    var tog=app.querySelector("[data-sheet-toggle]");
    if (tog) tog.onclick=function(){ S.sheet = S.sheet==="expanded"?"collapsed":"expanded"; render(); };
    var backBtn=app.querySelector("[data-sheet-collapse]");
    if (backBtn) backBtn.onclick=function(e){ e.stopPropagation(); S.sheet="collapsed"; render(); };
    app.querySelectorAll("[data-sheet-close]").forEach(function(el){ el.onclick=function(){ S.monthSheet=null; render(); }; });

    var input=app.querySelector("#newtask");
    if (input) input.addEventListener("keydown", function(e){
      if (e.key==="Enter"){ e.preventDefault(); addTask(input.value); }
    });
    app.querySelectorAll(".krow [data-act]").forEach(function(b){
      b.onclick=function(){
        var id=b.closest(".krow").dataset.id, act=b.dataset.act;
        if (act==="check") checkTask(id); else if (act==="uncheck") uncheckTask(id); else if (act==="del") deleteTask(id);
      };
    });
    var dt=app.querySelector("[data-donetoggle]"); if(dt) dt.onclick=function(){ S.doneOpen=!S.doneOpen; render(); };
    var dc=app.querySelector("[data-doneclear]"); if(dc) dc.onclick=function(){ clearDone(); };
  }

  function post(method, payload){
    return fetch("/api/tasks?t="+encodeURIComponent(TOKEN),
      { method:method, headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) }).catch(function(){});
  }
  async function addTask(title){
    title=(title||"").trim(); if(!title) return;
    try{
      var r=await fetch("/api/tasks?t="+encodeURIComponent(TOKEN),{
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({title:title})});
      var d=await r.json(); if(!d.ok) throw 0;
      S.tasks.open.push({id:d.task.id, owner:d.task.owner, title:d.task.title});
      render();
      var inp=app.querySelector("#newtask"); if(inp) inp.focus();
    }catch(e){ /* keep sheet open; user can retry */ }
  }
  function checkTask(id){
    var i=S.tasks.open.findIndex(function(t){return t.id===id;}); if(i<0) return;
    S.tasks.done.unshift(S.tasks.open.splice(i,1)[0]);
    post("PATCH",{id:id,done:true}); render();
  }
  function uncheckTask(id){
    var i=S.tasks.done.findIndex(function(t){return t.id===id;}); if(i<0) return;
    S.tasks.open.push(S.tasks.done.splice(i,1)[0]);
    post("PATCH",{id:id,done:false}); render();
  }
  function clearDone(){
    var ids=(S.tasks.done||[]).map(function(t){return t.id;});
    S.tasks.done=[];
    ids.forEach(function(id){ post("DELETE",{id:id}); });
    render();
  }
  function deleteTask(id){
    S.tasks.open=S.tasks.open.filter(function(t){return t.id!==id;});
    S.tasks.done=S.tasks.done.filter(function(t){return t.id!==id;});
    post("DELETE",{id:id}); render();
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
})();
</script>
</body>
</html>
